bio: "Medical Doctor and researcher working at the intersection of MedTech innovation, clinical research, and entrepreneurship. His work focuses on sore throat, one of the most common reasons for seeking medical care worldwide. He is developing innovative, AI-driven solutions that could enable patients to assess their condition from home using smartphone images and self-reported symptoms."
