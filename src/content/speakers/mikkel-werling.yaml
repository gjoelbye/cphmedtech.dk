bio: "PhD Fellow at the Department of Hematology at Rigshospitalet, Mikkel Werling specializes in applying machine learning and artificial intelligence to clinical research. With a background in cognitive science and health data science, his work focuses on developing predictive models to improve risk stratification and treatment outcome prediction in hematological cancers."
